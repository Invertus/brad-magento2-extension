name: Test Suite

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

jobs:
  unit-tests:
    name: Unit Tests - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: bcmath, ctype, curl, dom, ftp, gd, hash, iconv, intl, mbstring, openssl, pdo_mysql, simplexml, soap, sodium, xsl, zip

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-composer-cache-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: php-composer-cache-${{ matrix.php }}-

      # repo.magento.com needs account keys. The Mage-OS mirror serves the same
      # magento/* packages with no keys. composer.json is changed only on the runner.
      - name: Use the Mage-OS mirror for Magento packages
        run: composer config repositories.magento composer https://mirror.mage-os.org/

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        run: vendor/bin/phpunit
