# A real Magento (Mage-OS mirror packages) with the extension installed, plus a fake BradSearch.
# Started by run.sh; see README.md. Images are pinned by digest, so a re-pushed tag changes nothing.
name: bradsearch-integration

services:
  magento:
    image: markoshust/magento-php:8.3-fpm-8@sha256:1bbe8ffc9613e891ad2f2018bfa16a936a3018a0856981714f3c9ed25d288d76
    # Kept alive for `docker compose exec`; run.sh installs Magento, then starts PHP's web server.
    command: ["sleep", "infinity"]
    working_dir: /var/www/html
    environment:
      COMPOSER_CACHE_DIR: /composer-cache
    volumes:
      - ../..:/extension:ro
      - magento:/var/www/html
      - ${COMPOSER_CACHE_HOST_DIR:-composer-cache}:/composer-cache
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      wiremock:
        condition: service_started

  db:
    image: mariadb:11.4@sha256:a8992b5e5404d11e03c54a31d0c1bdea3fd116d283aa6d1a627551f29045309b
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: magento
      MARIADB_USER: magento
      MARIADB_PASSWORD: magento
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  opensearch:
    image: opensearchproject/opensearch:2.19.2@sha256:69588c664014fa3d3260ed5dd337f8538fec94790dad00bfbe92301eaaaac240
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 3s
      timeout: 5s
      retries: 60

  # Stands in for BradSearch: the search API and the sync webhook. Tests stub it and read its request journal.
  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    command: ["--disable-banner"]

volumes:
  magento:
  composer-cache:
